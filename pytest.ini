[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# tests/manual holds scripts that drive the real game window. Their filenames
# match test_*.py, so they must be excluded explicitly or a plain `pytest` run
# would try to screenshot and click the live game.
addopts = -ra --strict-markers --ignore=tests/manual
markers =
    slow: timed integration runs that drive a real Qt event loop
